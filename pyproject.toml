[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "statement-importer"
version = "0.1.0"
description = "Bank statement loading and standardization library"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic",
    "pydantic>=2.0",
    "PyYAML",
    "common-expression-language",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
]

[tool.hatch.build.targets.wheel]
packages = ["src/statement_importer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.isort]
profile = "black"
